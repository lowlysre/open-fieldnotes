name: Unit & WCAG Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch discussions
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pa11y-ci config
        run: npm run a11y:config

      - name: Start dev server
        run: |
          npx astro dev --host 127.0.0.1 --port 4321 > astro-dev.log 2>&1 &
          npx --yes wait-on@9 --timeout 60000 http-get://127.0.0.1:4321/open-fieldnotes/ || { cat astro-dev.log; exit 1; }

      - name: Accessibility tests
        uses: lowlysre/pa11y-ci-action@9cfc00c514ae1d06afa84ce15d3959f8bbca2e73 # v1.0.0